<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban-Flow Toolbox Portal (mockup)</title>
<meta name="description" content="Interactive mockup of the Urban-Flow Local Digital Twin Toolbox portal: Keycloak sign-in, interconnected modules, the tools marketplace and a clickable reference architecture.">
<link rel="icon" href="assets/urban-flow-logo-stacked.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  /* Urban-Flow template palette */
  --g900:#0E201D; --g800:#19332E; --g600:#33564F; --lime:#DBF27C; --olive:#C7D37D; --bg:#F2F2F2; --ink:#1C1C1C; --navy:#1A1B33;
  --ink2:#3a4744; --muted:#55625f; --line:#d9dcda; --line2:#c4c9c7; --card:#ffffff; --lime-tint:#eef7cf;
  /* architecture blues */
  --blue-layer:#9fcbe8; --blue-ink:#0f3550; --blue-badge:#dcecf7; --blue-c:#1d5778;
  --ext:#e7eaea; --warn-bg:#fbefd6; --warn:#7a4200; --alert:#b85600; --focus:#c26a00;
  --sans:Aptos,'Albert Sans','Segoe UI',system-ui,-apple-system,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--g600);text-underline-offset:2px} a:hover{color:var(--g900)}
button{font:inherit;cursor:pointer;color:inherit}
button svg{flex:0 0 auto}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{line-height:1.2;color:var(--g800)}
.hov:hover{filter:brightness(.94)}
.rowhov:hover{background:#eef0ef}
.mono{font-family:var(--mono)}
.stack{display:flex;flex-direction:column}
.wrap{display:flex;flex-wrap:wrap}
.grid-auto{display:grid;gap:14px}
.small{font-size:13px;color:var(--muted)}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g600)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
.pill.sample{background:var(--warn-bg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:999px;font-weight:600;border:1.5px solid var(--g800);background:#fff;color:var(--g800)}
.btn.primary{background:var(--g800);color:#fff;border-color:var(--g800)}
.btn.primary:hover{background:var(--g900);filter:none}
.btn.lime{background:var(--lime);color:var(--g900);border-color:var(--lime)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff}
.btn.ghost:hover{border-color:var(--lime);filter:none}
.iconbtn{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:999px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 12px;border-radius:999px;background:#e6e9e8;color:var(--ink2)}
.badge.mp{background:var(--g800);color:var(--lime);font-weight:700}
.badge.layer{background:var(--blue-badge);color:var(--blue-c);font-weight:700}
.badge.iam{background:#e3e4f0;color:var(--navy);font-weight:700}
.badge.ext{background:var(--ext);color:var(--ink2);font-weight:700}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;background:var(--g900) url('assets/aerial-1.jpg') center/cover no-repeat}
.login .center{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.login-card{width:100%;max-width:520px;background:#fff;border-radius:18px;padding:34px;display:flex;flex-direction:column;gap:20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.login-card .logo{height:78px;width:auto;align-self:flex-start}
.role-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:62px;border:1.5px solid var(--line2);border-radius:12px;background:#fff}
.role-btn:hover{border-color:var(--g800);background:var(--lime-tint);filter:none}
.note{margin:0;padding:12px 14px;background:#f3f5f4;border-radius:10px;font-size:13px;color:var(--ink2)}
.login .fund{background:rgba(14,32,29,.85)}
.fund{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;color:#fff}
.fund img{height:44px;width:auto;max-width:100%}
.fund a{color:#fff;font-weight:700;text-decoration:none}
.ccbar{background:var(--g600);color:#fff;font-size:12px;padding:6px 28px;display:flex;flex-wrap:wrap;gap:6px 18px}
.ccbar b{font-weight:700}

/* ---------- header ---------- */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 24px;background:var(--g900);color:#fff;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--lime)}
.brand{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#fff;padding:4px;min-height:44px}
.brand img{height:30px;width:auto;display:block}
.brand .sub{font-size:12px;color:var(--lime);font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-left:1px solid rgba(255,255,255,.3);padding-left:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1)}
.seg button{min-height:38px;padding:6px 14px;border:0;border-radius:999px;background:transparent;color:#fff;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--g900)}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.1)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--g900);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
main{max-width:1320px;margin:0 auto;padding:28px 24px 56px}
.vidbtn svg{flex:0 0 auto}
.vidov{z-index:60;align-items:center;justify-content:center}
.vidbox{position:relative;z-index:1;width:min(1100px,92vw);background:#0E201D;border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px}
.vidhead{display:flex;justify-content:space-between;align-items:center;color:#fff}
.vidhead strong{display:flex;align-items:center;gap:8px;font-size:16px}
.vidhead .iconbtn{background:rgba(255,255,255,.12);color:#fff;border:0}
.vidbox video{width:100%;aspect-ratio:16/9;max-height:78vh;border-radius:10px;background:#000;display:block}
.vidnote{color:#c9d6d2;margin:0}
.vidnote code{color:#DBF27C}
main.focusmain{max-width:1600px;padding:20px 28px 32px}
.focusbar{position:fixed;top:12px;right:16px;z-index:40;display:flex;gap:8px}
.fbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;border:0;background:var(--g900);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.fbtn.lime{background:var(--lime);color:var(--g900)}
.fbtn svg{width:18px;height:18px}
.fbtn:hover{filter:brightness(1.08)}
@media (max-width:700px){.fbtn span{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--g900) url('assets/aerial-2.jpg') center/cover no-repeat;color:#fff;padding:34px 32px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px}
.hero h1{color:var(--lime);font-size:38px;margin:6px 0 8px;font-weight:800}
.hero .eyebrow{color:#fff;opacity:.85}
.hero p{margin:0;max-width:760px;color:#e8eeec}

/* ---------- home ---------- */
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:20px}
.kpi{text-align:left;display:flex;flex-direction:column;gap:4px;padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff;min-height:124px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--lime)}
.kpi .v{font-size:32px;font-weight:800;line-height:1.1;color:var(--g800)}
.kpi .l{font-size:13px;color:var(--g600);font-weight:700}
.mp-head{display:flex;align-items:center;gap:10px}
.mp-icon{width:40px;height:40px;border-radius:12px;background:var(--g800);color:var(--lime);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.domain{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:var(--g800);color:#fff}
.domain h3{margin:0;font-size:16px;color:var(--lime)}
.domain button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;min-height:44px;padding:8px 12px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-size:14px;font-weight:500}
.domain button:hover{background:var(--lime-tint);filter:none}
.domain .partners{font-size:12px;color:#cfdad6}
.uitile{text-align:left;display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;min-height:100px}
.uitile:hover{border-color:var(--g600);filter:none}
.alert{display:flex;gap:10px;padding:10px;border-radius:10px;background:#fbf3ea}
.alert i{width:6px;border-radius:4px;background:var(--alert);flex:0 0 6px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:transparent;text-align:left;width:100%}
.access{padding:18px;border-radius:14px;background:var(--g800);color:#fff;display:flex;flex-direction:column;gap:8px}
.access h2{color:var(--lime);margin:0;font-size:16px}

/* ---------- tool page ---------- */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.crumb button{border:0;background:transparent;color:var(--g600);padding:4px 0;text-decoration:underline;font-weight:600}
.ws{flex:999 1 600px;min-width:0;padding:22px;display:flex;flex-direction:column;gap:14px}
.side{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.side section{padding:18px;display:flex;flex-direction:column;gap:8px}
.side h2{margin:0;font-size:16px}
.repo{display:flex;align-items:center;gap:8px;min-height:34px;font-size:14px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border:1.5px solid var(--line2);border-radius:999px;background:#fff;font-size:14px}
.chip:hover{border-color:var(--g800);filter:none}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.toolcard{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fff}
.toolcard h3{margin:0;font-size:16px}
.toolcard .who{display:flex;flex-wrap:wrap;gap:6px}
.partner{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--lime);color:var(--g900)}
.city{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px 2px 4px;border-radius:999px;background:#f3f5f4;border:1px solid var(--line);color:var(--ink2)}
.city svg{border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.wp{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--g800);color:var(--lime)}
.task{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:#fff;color:var(--g800);border:1.5px solid var(--g800)}
.partner.os{background:#dcecf7;color:#0f3550}
.partner.int{background:#e6e9e8;color:var(--ink2);font-weight:600}
.refc{font-size:12px;padding:3px 10px;border-radius:999px;background:#e6e9e8;color:var(--ink2);font-family:var(--mono)}

/* map */
.map{position:relative;height:400px;border-radius:12px;overflow:hidden;background:#e4e8e3;border:1px solid #cfd6cf}
.map .r{position:absolute;background:#fff}
.map .w{position:absolute;left:0;right:0;top:58%;height:46px;background:#c9dde8}
.map .p{position:absolute;border-radius:8px;background:#cddcb8}
.mk{position:absolute;transform:translate(-8px,-50%);display:flex;align-items:center;gap:6px}
.mk i{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk span{background:#fff;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2);white-space:nowrap}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-size:20px}
.cap{position:absolute;left:12px;bottom:12px;background:var(--g900);color:var(--lime);border-radius:8px;padding:6px 10px;font-size:12px;font-family:var(--mono)}
/* chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:280px;padding:0 4px;border-bottom:1px solid #a9b3b0}
.bar{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bar b{width:100%;max-width:40px;border-radius:6px 6px 0 0;display:block;background:var(--g600)}
.bar span,.xlab span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.xlab{display:flex;gap:6px;padding:0 4px}
.xlab span{flex:1 1 0;min-width:0;text-align:center}
/* table (template style) */
.tbl{overflow-x:auto;border-radius:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:11px 12px;background:var(--g900);color:#fff;font-size:13px;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:2px solid #fff}
.tbl tbody tr:nth-child(odd) td{background:#dcdedd}
.tbl tbody tr:nth-child(even) td{background:#ecedec}
/* chat */
.chatbox{display:flex;flex-direction:column;gap:12px;min-height:280px;background:#f3f5f4;border-radius:12px;padding:16px}
.bub{max-width:85%;padding:12px 14px;border-radius:14px}
.bub.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.bub.q{align-self:flex-end;background:var(--g800);color:#fff}
.bub .src{display:block;margin-top:6px;font-size:12px;color:var(--g600);font-family:var(--mono)}
.sugg{text-align:left;min-height:44px;padding:8px 14px;border:1.5px solid var(--line2);border-radius:12px;background:#fff;font-size:14px}
.sugg:hover{border-color:var(--g800);background:var(--lime-tint);filter:none}
.segl{display:flex;gap:4px;padding:3px;border-radius:999px;background:#e6e9e8;align-self:flex-start}
.segl button{min-height:38px;padding:6px 16px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:14px}
.segl button[aria-pressed="true"]{background:var(--g800);color:var(--lime)}
/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.step{display:flex;align-items:center;gap:8px;flex:1 1 180px;min-width:0}
.step .box{flex:1 1 auto;min-width:0;padding:14px;border-radius:12px;border:1px solid #c9d3cf;background:#f6f8f7;display:flex;flex-direction:column;gap:6px}
.step:last-child svg{display:none}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line)}


/* ---------- tools & partners directory ---------- */
.tdir-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.tdir-search{border-radius:999px!important;padding:8px 16px!important}
.tdir-tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--tc,var(--line2));background:#fff;color:var(--ink);font-size:13px;font-weight:700}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--tc,var(--line2));display:inline-block}
.tag b{font-weight:600;opacity:.75}
button.tag:not([aria-pressed="true"]):hover{background:var(--tb,#f3f5f4)}
.tag[aria-pressed="true"]{background:var(--tc,var(--g800));color:var(--tx,#fff);border-color:var(--tc,var(--g800))}
.tag[aria-pressed="true"] i{background:var(--tx,#fff)}
.tag.static{min-height:26px;padding:2px 10px;font-size:12px;background:var(--tb,#f3f5f4);white-space:nowrap}
.tag.static.fill{background:var(--tc);color:var(--tx,#fff);border-color:var(--tc);font-weight:800}
.tag.static.fill i{background:var(--tx,#fff)}
.tdir{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
.tdir th{text-align:left;padding:10px 14px;background:var(--g900);color:#fff;font-size:13px;white-space:nowrap}
.tdir th:first-child{border-radius:10px 0 0 10px}.tdir th:last-child{border-radius:0 10px 10px 0}
.tdir td{padding:0;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tdir td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}.tdir td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.tdir tr.dirrow:hover td{background:var(--lime-tint)}
.tdir .cellbtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;min-height:48px;font:inherit}
.tdir .tn{font-weight:700;color:var(--g800)}
.tdir .tn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.tdir-count{font-size:13px;color:var(--muted)}
.tdir tr.dirgrp td{padding:11px 16px;border:0;border-radius:10px}
.tdir tr.dirgrp.mp td{background:var(--g800);color:var(--lime)}
.tdir tr.dirgrp.oth td{background:#dfe4e1;color:var(--g800)}
.dirgrp .gt{display:inline-flex;align-items:center;gap:8px;margin-right:12px;font-weight:800;font-size:15px;vertical-align:middle}
.dirgrp .gs{font-size:13px;opacity:.85}
.dirgrp .gc{float:right;font-size:13px;font-weight:700}
@media (max-width:700px){.dirgrp .gs{display:none}}
.tdir-f{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0;font-size:12px;font-weight:700;color:var(--g600)}
.tdir-f select,.tdir-f input{min-height:44px;width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:6px 12px;font:inherit;font-weight:500;background:#fff;color:var(--ink)}
.tdir-bar{align-items:flex-end}
.tdir-reset{min-height:44px}
.tdir-dd{position:relative}
.tdir-dd-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:6px 12px;background:#fff;color:var(--ink);font:inherit;font-weight:500;text-align:left}
.tdir-dd-btn[aria-expanded="true"]{border-color:var(--g800)}
.tdir-dd-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:30;width:max-content;min-width:100%;max-width:min(380px,90vw);max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column;gap:2px}
.tdir-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;border:0;border-radius:8px;background:transparent;text-align:left;font:inherit;color:var(--ink)}
.tdir-opt:hover{background:var(--lime-tint)}
.tdir-opt[aria-selected="true"]{background:#f1f4ef}
.tdir-opt.ind{padding-left:18px}
.tdir-opt .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.tdir-opt .ck{color:var(--g600);font-weight:800}
.tdir-opt .dd-plain,.tdir-dd-btn .dd-plain{font-weight:600}
.tdir-dd-panel .dd-h{margin:8px 10px 2px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag.static.fill.dd-mp{background:var(--g800);border-color:var(--g800);color:var(--lime)}
.tag.static.fill.dd-mp i{background:var(--lime)}
.tdir-reset:disabled{opacity:.45;cursor:default}
.tdir-empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- architecture ---------- */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}

.layer.i{background:#c9d3ea;display:flex;flex-direction:column;gap:10px} .layer.i h2{color:var(--navy);margin:0}

.blk{min-height:44px;padding:6px 8px;border:0;border-radius:6px;background:#fff;font-size:13px;color:var(--ink)}

.toolcard.faded{opacity:.4}
.layer h2{display:flex;align-items:center;gap:8px}
.info{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1.5px solid currentColor;background:rgba(255,255,255,.55);color:inherit;font:700 13px/1 Georgia,'Times New Roman',serif;font-style:italic;display:inline-flex;align-items:center;justify-content:center;padding:0;position:relative}

function twinSVG(seed, d3) {

      var w = (30 + r() * 46) * sc, dpt = 16 * sc, h = (16 + r() * 62) * sc, park = r() < .12, hi = r() < .06;

      var top = hi ? '#DBF27C' : '#f4f6f7', front = hi ? '#8f5a45' : '#dfe4e7', side = hi ? '#6e4234' : '#c3cbd0';
      var X = x, Y = y;
      items.push({ y: Y, s: '<polygon points="' + [X + w, Y, X + w + dpt, Y - dpt * .6, X + w + dpt, Y - dpt * .6 - h, X + w, Y - h].map(function (v) { return v.toFixed(1); }).join(',') + '" fill="' + side + '"/>' +
        '<rect x="' + X.toFixed(1) + '" y="' + (Y - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + front + '"/>' +
        '<polygon points="' + [X, Y - h, X + dpt, Y - h - dpt * .6, X + w + dpt, Y - h - dpt * .6, X + w, Y - h].map(function (v) { return v.toFixed(1); }).join(',') + '" fill="' + top + '"/>' +
        (hi ? '' : '<path d="M' + (X + w * .2).toFixed(1) + ' ' + (Y - h * .7).toFixed(1) + 'h' + (w * .6).toFixed(1) + '" stroke="#c9d0d4" stroke-width="' + (1.2 * sc).toFixed(1) + '"/>') });
